<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 font-[Inter]">

  <!-- Header -->
  <div class="bg-blue-600 h-12 flex items-center px-6">
    <div class="w-4 h-4 bg-white rounded-full"></div>
  </div>

  <!-- Content -->
  <div class="flex items-center justify-center min-h-[calc(100vh-48px)]">
    <div class="border-2 border-blue-600 rounded-xl bg-gray-100 p-8 w-[720px]">
      <div class="flex justify-between gap-6">

        <!-- Left -->
        <div class="w-1/2">
          <h2 class="text-lg font-semibold text-blue-700 mb-2">
            Enhance your Hiring Experience with ATS
          </h2>

          <p class="text-sm text-gray-600 mb-4">
            Streamline recruitment using a modern Applicant Tracking System.
          </p>

          <div class="mb-3">
            <label for="landingEmail" class="sr-only">Email</label>
            <input
              id="landingEmail"
              type="email"
              required
              placeholder="Enter your email"
              class="w-full h-11 px-3 border rounded-lg text-sm"
            >
          </div>

          <div class="mb-4">
            <label for="role" class="sr-only">User Role</label>
            <select
              id="role"
              required
              class="w-full h-11 px-3 border rounded-lg text-sm"
            >
              <option value="">Select role</option>
              <option>Applicant</option>
            </select>
          </div>

          <a
            href="form.html"
            class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium"
          >
            Proceed
          </a>
        </div>

        <!-- Right -->
        <div class="w-1/2 flex justify-center">
          <img
            src="https://cdn-icons-png.flaticon.com/512/2972/2972185.png"
            alt="Hiring Illustration"
            class="w-64"
          >
        </div>

      </div>
    </div>
  </div>

</body>
</html>
