<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applicant Form – Step 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-300 font-[Inter]">

  <div class="bg-blue-600 text-white text-center py-4 text-lg font-medium">
    Upload Resume
  </div>

  <p class="text-center mt-3 text-sm text-gray-700">
    Step 2 of 2 – Resume Upload
  </p>

  <div class="flex justify-center mt-6">
    <div class="bg-white rounded-xl shadow-md w-[420px] p-8">

      <form id="formStep2" class="space-y-6">

        <!-- Resume Upload -->
        <div>
          <label for="resume" class="text-sm font-medium block mb-2">
            Upload Resume *
          </label>

          <input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx"
            aria-label="Upload Resume" class="hidden">

          <label for="resume"
            class="border-2 border-dashed border-gray-400 rounded-lg h-32 flex items-center justify-center text-sm cursor-pointer">
            Click to upload (PDF / DOC)
          </label>

          <p id="fileName" class="text-sm text-green-600 mt-2 hidden"></p>
        </div>

        <!-- Comments -->
        <div>
          <label for="comments" class="text-sm font-medium block mb-2">
            Comments (optional)
          </label>
          <textarea id="comments" name="comments"
            placeholder="Any additional notes"
            class="w-full h-24 p-2 border rounded"></textarea>
        </div>

        <!-- Buttons -->
        <div class="flex justify-between">
          <a href="form.html" class="bg-blue-600 text-white px-4 py-1 rounded text-sm">
            ← Prev
          </a>

          <button type="submit"
            class="bg-green-500 text-white px-4 py-1 rounded text-sm">
            Submit
          </button>
        </div>

      </form>
    </div>
  </div>

<script>
const resume = document.getElementById("resume");
const fileName = document.getElementById("fileName");

resume.addEventListener("change", () => {
  if (resume.files.length > 0) {
    fileName.textContent = "✔ " + resume.files[0].name;
    fileName.classList.remove("hidden");
  }
});

document.getElementById("formStep2").addEventListener("submit", async function(e) {
  e.preventDefault();

  if (resume.files.length === 0) {
    alert("Please upload your resume");
    return;
  }

  const savedData = JSON.parse(localStorage.getItem("formData"));

  const formData = new FormData();
  formData.append("resume", resume.files[0]);
  formData.append("full_name", savedData.name);
  formData.append("date_of_birth", savedData.dob);
  formData.append("email", savedData.email);
  formData.append("highest_degree", savedData.degree);
  formData.append("years_of_experience", savedData.experience);
  formData.append("preferred_course", savedData.course);
  formData.append("comments", document.getElementById("comments").value);

  try {
    const res = await fetch("http://localhost:3000/applicant", {
      method: "POST",
      body: formData   // ✅ IMPORTANT: no headers
    });

    const result = await res.json();
    localStorage.setItem("application_code", result.application_code);
    window.location.href = "success.html";
  } catch (err) {
    console.error(err);
    alert("Submission failed");
  }
});
</script>

</body>
</html>
